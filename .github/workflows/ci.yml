name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # A documentation-only push cannot change a byte of the APK, so it skips
    # the pipeline instead of spending ~40 minutes to publish an identical
    # build under a new version number.
    #
    # Three things make this safe rather than merely cheap:
    #
    #   * A push is skipped only when EVERY changed file matches. Touch one
    #     Kotlin file alongside the docs and the full pipeline still runs.
    #   * Tags are unaffected: "Path filters are not evaluated for pushes of
    #     tags", so a `v*` release never skips, whatever its commit holds.
    #   * .github/** is deliberately absent from this list. A change to the
    #     pipeline must be validated by the pipeline.
    #
    # Both Markdown spellings are listed on purpose. '**.md' is the form
    # GitHub's own examples use and matches at any depth including the repo
    # root; '**/*.md' is kept alongside it because a leading '**/' is read by
    # some glob engines as requiring a directory segment, which would miss
    # README.md at the root -- exactly the file this is for. paths-ignore is
    # a union, so the overlap costs nothing.
    paths-ignore:
      - '**.md'
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      # Iterating on a single instrumented test otherwise costs the whole
      # emulator suite: ~39 of the job's ~44 minutes are test execution, not
      # the build or the boot. Naming the class (or a comma-separated list)
      # runs only those, which is what makes a fix loop affordable instead of
      # one 40-minute cycle per attempt.
      #
      # It cannot weaken the release gate. On a push and on a pull_request
      # `inputs` is empty, so the script's test renders false and the smoke
      # subset runs (a hand-dispatch with an empty filter gets the FULL
      # suite); a filter only ever exists on a hand-dispatched run, and the
      # release job below refuses one outright.
      e2e_filter:
        description: 'Instrumented test classes to run, e.g. com.roombrowser.TwoFactorE2eTest (comma-separate for several). Empty runs the FULL suite (a plain push runs the smoke subset).'
        required: false
        type: string
        default: ''
  schedule:
    # NIGHTLY FULL-SUITE GUARD. A push to main runs the smoke subset (see the
    # e2e job); the complete 108-test suite must still run somewhere, or a
    # regression in an unsmoked class ships unnoticed for weeks. 02:00 UTC
    # (09:00 WIB) sits after the day's pushes have settled. Only the e2e job
    # runs on this trigger — every other job carries
    # `github.event_name != 'schedule'` — and the release job refuses a
    # scheduled run outright, so the nightly guard VERIFIES and never
    # publishes.
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled ONLY on pull requests. A push to main or a
  # v* tag must never be cancelled by the next push: the release job is the
  # tail of this pipeline, and although the draft->publish flow below makes
  # even a killed release recoverable, burning (and re-burning) a ~2h build
  # + emulator run because a second push arrived five minutes later is pure
  # waste — the runs queue instead. This is the audit's top robustness fix
  # ("cancel-in-progress can kill an in-flight release mid-upload").
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The daemon is left on: it is started once per job and reused by every
  # later ./gradlew in that job (there are up to six in `quality` alone),
  # instead of paying JVM start plus cold JIT on each one. It exits with the
  # runner. --console=plain is already passed on every gradle command.
  GRADLE_OPTS: -Dorg.gradle.console=plain
  # SHA-256 of the release signing certificate, same keystore in both editions.
  # "apksigner says it verifies" is not enough: a swapped keystore also
  # verifies, and produces an APK that can never upgrade an installed one.
  RELEASE_CERT_SHA256: 0ea926c1075213a9e04420fadca34d0c763ffe6c9e765d470ccf8c217318fec8

jobs:
  # ---------------------------------------------------------------------
  # RELEASE VERSION: exercises `.github/actions/release-version` on every
  # run, including pull_request and dispatch. The `release` job is the only
  # other caller and it never runs on a pull request, so without this job a
  # broken version step would first fail on a real release — after the two
  # Android gates had already passed. Seconds to run, and nothing `needs:` it,
  # so it costs the pipeline no wall-clock.
  # ---------------------------------------------------------------------
  version:
    name: Release version (parity with the sibling edition)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the version this pipeline would publish
        id: v
        uses: ./.github/actions/release-version
        with:
          peer-repo: SecretArrow/room-browser-geckoview

      - name: Report it
        run: |
          echo "### Would publish ${{ steps.v.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "versionName \`${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # AUTO-FIX: runs lintFix CONCURRENTLY with every other job; if it
  # auto-corrects anything, the fixes are committed & pushed (PAT_TOKEN
  # re-triggers a clean pipeline run that validates the fixed tree).
  # Nothing waits on this job — see the note on `e2e`.
  # ---------------------------------------------------------------------
  autofix:
    name: Auto-fix (lintFix)
    runs-on: ubuntu-latest
    # The nightly schedule trigger exists for the e2e full suite only; an
    # autofix over an unchanged tree is a no-op worth no runner.
    if: github.event_name != 'schedule'
    # lintFix is minutes of work; the explicit ceiling stops a hung gradle
    # from holding a runner for the 360-minute default.
    timeout-minutes: 30
    env:
      # The branch autofix commits onto, and it has to be named explicitly.
      #
      # On a pull_request event GitHub checks out the PR's MERGE commit
      # (refs/pull/N/merge) in detached HEAD, and github.ref_name is then the
      # literal string "1/merge". Pushing to that is not an edge case that
      # mostly works: git refuses outright, because an unqualified destination
      # that matches no ref on the remote cannot be guessed at --
      #
      #   error: The destination you provided is not a full refname
      #   error: failed to push some refs
      #
      # -- which is exactly how this job failed on a PR run the moment it had
      # something to commit. The variable is fully qualified for both events
      # on purpose: git's fallback is to look for a ref matching the
      # destination on the remote, and it gives up when it finds none.
      #
      # Committing onto the PR's head branch rather than the merge commit also
      # keeps a stray merge commit out of the branch every time autofix fires.
      AUTOFIX_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # See AUTOFIX_REF. Without this the tree committed below would sit
          # on top of the merge commit and drag it onto the branch.
          ref: ${{ env.AUTOFIX_REF }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned Android SDK components
        uses: actions/cache@v6
        with:
          # The runner image ships NDK 27.3/28.2/29.0 and CMake 3.31/4.1; this
          # build pins 27.0.12077973 and 3.22.1, so the step below takes its
          # install branch on EVERY job — five times per pipeline, on the
          # serialized path autofix -> quality -> e2e -> release. The guard
          # still runs, so a partial restore simply reinstalls.
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.0.12077973-cmake-3.22.1-${{ runner.os }}

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          # Hard verification: a corrupted/partial NDK install must FAIL the
          # job loudly (CXX1101 'missing source.properties' cost a full CI
          # round) instead of surfacing as a gradle configure error later.
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply automatic lint fixes
        working-directory: android
        run: |
          set +e
          ./gradlew lintFix --console=plain --continue
          rc=$?
          set -e
          # AGP lintFix exits 1 BY DESIGN when it applied quickfixes
          # ("Aborting build since sources were modified..."). That is the
          # success path here: fixes land via the commit step below.
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No auto-fixes were applied (lintFix exit code: $rc)."
            if [ $rc -ne 0 ]; then
              echo "lintFix failed without applying fixes — surfacing real lint errors."
              exit $rc
            fi
          else
            echo "lintFix applied changes to the working tree."
          fi

      - name: Commit and push fixes (if any)
        id: push
        # Branch pushes and PR heads only — NEVER a v* tag push. On a tag
        # push AUTOFIX_REF is the tag ref itself (refs/tags/vX) and
        # "git push HEAD:refs/tags/vX" cannot succeed: a tag cannot be
        # advanced, which made this job reliably red on every release tag.
        # A tag points at an immutable snapshot; lint findings there are
        # fixed on a branch like any other change.
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        env:
          # The tokens travel through the environment (the same pattern
          # backup-signing-key.yml uses for PAT_TOKEN), never through
          # template interpolation into the script text or the push URL.
          # What runs — and everything that renders it, from debug logs to
          # "ps" — sees only the variable name; log masking stays as a
          # second layer.
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "room-browser-autofix"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to auto-fix."
            echo "pushed_with_pat=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          # NO "[skip ci]" here, and that is load-bearing: the other jobs no
          # longer wait for this one, so the run that is in flight right now
          # is testing the PRE-fix tree. Without a fresh run the pipeline
          # could report green while main's HEAD is the fixed commit that
          # nothing ever validated. The PAT push below is what starts it.
          git commit -m "chore(ci): auto-fix lint findings"
          # Prefer PAT_TOKEN: pushes with it re-trigger the workflow so the
          # fixed tree gets a full clean pipeline run (GITHUB_TOKEN would not).
          if [ -n "$PAT_TOKEN" ]; then
            git push "https://x-access-token:$PAT_TOKEN@github.com/${{ github.repository }}.git" HEAD:${{ env.AUTOFIX_REF }}
            echo "pushed_with_pat=true" >> "$GITHUB_OUTPUT"
            echo "Auto-fixes pushed with PAT — a fresh CI run now validates the fixed tree."
          else
            git push "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" HEAD:${{ env.AUTOFIX_REF }}
            echo "pushed_with_pat=false" >> "$GITHUB_OUTPUT"
            echo "WARN: PAT_TOKEN secret not set — pushed with GITHUB_TOKEN (no re-trigger)."
          fi

  # ---------------------------------------------------------------------
  # QUALITY GATE: lint + unit tests + debug build on JVM only.
  # Starts WITH autofix, not after it — see the note on `e2e` below.
  # ---------------------------------------------------------------------
  quality:
    name: Lint + unit tests + debug build
    runs-on: ubuntu-latest
    # Same reason as autofix: the nightly schedule exists for the e2e full
    # suite only, and lint/unit over an unchanged tree verified nothing new.
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned Android SDK components
        uses: actions/cache@v6
        with:
          # The runner image ships NDK 27.3/28.2/29.0 and CMake 3.31/4.1; this
          # build pins 27.0.12077973 and 3.22.1, so the step below takes its
          # install branch on EVERY job — five times per pipeline, on the
          # serialized path autofix -> quality -> e2e -> release. The guard
          # still runs, so a partial restore simply reinstalls.
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.0.12077973-cmake-3.22.1-${{ runner.os }}

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch the Node runtime (nodejs-mobile, pinned)
        # libnode.so is 58-65 MB per ABI and does not belong in a public
        # repository, so CI downloads the pinned release instead of it being
        # committed. The CMake configure tolerates its absence — a checkout
        # without it still builds, it just builds an APK whose runtime reports
        # itself unavailable — so this is a build input, not a release-only one.
        # The pinned release ships arm64-v8a, armeabi-v7a and x86_64 and no
        # 32-bit x86: that ABI's shim is compiled without libnode on purpose
        # (android/node/src/main/cpp/CMakeLists.txt).
        working-directory: android
        run: |
          set -euo pipefail
          TAG=v18.20.4
          ZIP="$RUNNER_TEMP/nodejs-mobile-android.zip"
          curl -sSL --retry 3 -o "$ZIP" \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${TAG}/nodejs-mobile-${TAG}-android.zip"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "node/src/main/jniLibs/$abi"
            unzip -o -j "$ZIP" "bin/$abi/libnode.so" -d "node/src/main/jniLibs/$abi" > /dev/null
          done
          mkdir -p node/src/main/cpp/nodejs-mobile
          unzip -o -q "$ZIP" 'include/*' -d node/src/main/cpp/nodejs-mobile
          test -f node/src/main/cpp/nodejs-mobile/include/node/node.h \
            || { echo "::error::the Node headers were not unpacked"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "node/src/main/jniLibs/$abi/libnode.so" \
              || { echo "::error::libnode.so is missing for $abi"; exit 1; }
          done
          echo "Node runtime unpacked: $(du -sh node/src/main/jniLibs | cut -f1)"

      - name: Static analysis (Android Lint)
        working-directory: android
        run: ./gradlew lintDebug --console=plain

      - name: Kotlin style (ktlint)
        working-directory: android
        run: ./gradlew ktlintCheck --console=plain

      - name: WebView defaults static test
        working-directory: android
        # The out-of-the-box web-compatibility contract (what a fresh install
        # sends: a neutralized UA, no X-Requested-With header, cookies and DOM
        # storage on, no shield on by default) is decided in a handful of
        # source lines, and this proof reads those lines and asserts what they
        # say. Plain Node, no Gradle, so it costs seconds here -- the repo's
        # rule that a fast-job failure is worth more than an e2e one applies,
        # and the file is edition-aware: the GeckoView sibling runs the same
        # proof for its half of the parity.
        run: node tools/test_webview_defaults.js

      - name: Unit tests (domain + app)
        working-directory: android
        # --continue so a failure in one module still reports the other's
        # result instead of hiding it, and one retry because several tests in
        # this suite assert on HOW FAST a coroutine abort propagates (the
        # pause/resume contract in OllamaLocalTest). A CPU-starved shared
        # runner can fail those with no code being wrong — that has happened
        # twice. A genuinely broken test fails both attempts, so the gate
        # still holds; the annotation keeps the retry visible, not silent.
        run: |
          ./gradlew testDebugUnitTest :core:domain:test :core:wallet:test :engine:test --console=plain --continue || {
            echo "::warning title=Unit tests flaked::First attempt failed — retrying once. A load-induced flake passes now; a real failure fails again."
            ./gradlew testDebugUnitTest :core:domain:test :core:wallet:test :engine:test --console=plain --continue
          }

      - name: Compile the instrumented test sources
        working-directory: android
        # The suite's other half, compiled where a mistake costs a minute
        # instead of a full e2e cycle. Nothing else in this job ever builds
        # `src/androidTest` — only the e2e job does, so a typo in a test
        # source is discovered after the emulator boot, the APK install and
        # the whole suite, and is reported there as a TEST failure rather
        # than a compile failure. This step moves that discovery forward:
        # compileDebugAndroidTestKotlin compiles without running anything, so
        # it adds no emulator and no test execution.
        #
        # It is not a substitute for the e2e job: nothing here proves the
        # assertions are right, only that they are well-formed.
        run: ./gradlew compileDebugAndroidTestKotlin --console=plain

      - name: Debug build (all ABIs)
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Release build validation (unsigned, ARM-focused)
        working-directory: android
        # R8-minified release builds for the real-device ARM ABIs, UNSIGNED
        # here on purpose: this job holds no secrets, so it exercises the
        # shrinker and the ABI focus before the ~50 min e2e gate and
        # hard-verifies that exactly the two focused APKs come out. The
        # shippable APKs are built AND signed in the release job, which
        # stamps the release version and proves the signature with apksigner.
        env:
          RB_UNSIGNED_RELEASE: "true"
          RB_RELEASE_ABIS: "arm64-v8a,armeabi-v7a"
        run: |
          ./gradlew assembleRelease --console=plain
          # NOTE: this step runs with working-directory=android — paths
          # below are relative to android/ (CI 7858b99: the first version of
          # this check ls'd android/app/build/... from INSIDE android/ and
          # failed to find files that the build HAD produced).
          for abi in arm64-v8a armeabi-v7a; do
            ls app/build/outputs/apk/release/room-browser-*-${abi}-release*.apk >/dev/null 2>&1 \
              || { echo "::error::expected release APK for ${abi} not produced"; ls -l app/build/outputs/apk/release/ || true; exit 1; }
          done
          # No universal / x86 APKs may appear in the focused release set.
          if ls app/build/outputs/apk/release/*universal*.apk app/build/outputs/apk/release/*x86*.apk >/dev/null 2>&1; then
            echo "::error::unfocused ABI leaked into the release build"; ls -l app/build/outputs/apk/release/; exit 1
          fi

      - name: Report the release APK sizes
        working-directory: android
        # A measurement, not a gate. The embedded Node runtime adds tens of MB
        # per ABI, and the only way a further jump gets noticed is for the
        # number to be printed on every run rather than estimated once. The
        # per-ABI libnode.so is listed beside it because that is where such a
        # change would come from.
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            printf 'release APK: %s MB (%s bytes)  %s\n' \
              "$(( $(stat -c%s "$apk") / 1024 / 1024 ))" "$(stat -c%s "$apk")" "$(basename "$apk")"
            # HOW the native payload is stored, not just how big it is. A
            # deflated libnode.so is unpacked at install time, and that is the
            # one thing the zip-level packaging check below cannot see: it
            # accepts a deflated library as readily as a stored one.
            unzip -v "$apk" 'lib/*/libnode.so' 2>/dev/null | grep 'libnode\.so' || true
          done
          for so in node/src/main/jniLibs/*/libnode.so; do
            [ -f "$so" ] || continue
            printf 'libnode.so:  %s MB (%s bytes)  %s\n' \
              "$(( $(stat -c%s "$so") / 1024 / 1024 ))" "$(stat -c%s "$so")" "$so"
          done

      - name: Check the release APKs' archive packaging
        working-directory: android
        # The rules `zipalign -c -P 16` enforces: every Stored entry on a
        # 4-byte boundary, every lib/**/*.so Stored and 16 KB aligned,
        # resources.arsc Stored. AGP gets this right today, and every way it
        # can break is silent — the APK still builds, installs and runs; only
        # a Play upload or a 16 KB-page device notices. The self-test runs
        # first: a gate never seen to reject anything is indistinguishable
        # from one that cannot.
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/verify_apk_packaging.py" --self-test
          python3 "$GITHUB_WORKSPACE/tools/verify_apk_packaging.py" app/build/outputs/apk/release/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-report
          # The per-source-set .txt files hold the rule id, file:line and the
          # offending snippet — that is the list the config gets tuned from.
          path: |
            android/app/build/reports/ktlint/
            android/core/domain/build/reports/ktlint/
            android/core/wallet/build/reports/ktlint/
            android/engine/build/reports/ktlint/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/
            android/core/domain/build/reports/tests/
            android/core/wallet/build/reports/tests/
            android/engine/build/reports/tests/
            android/node/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # E2E / INSTRUMENTED TESTS on a real emulator:
  # profile CRUD, cross-process browsing flow, DB isolation, WebView
  # data-directory binding (spec sections 59/60).
  # ---------------------------------------------------------------------
  e2e:
    name: E2E instrumented tests (emulator)
    # Runs ALONGSIDE quality AND autofix, not after either. e2e checks out and
    # builds on its own and consumes nothing the other jobs produce, so every
    # `needs:` edge into it bought no correctness — each one only put the
    # 50-minute emulator run further behind, and the emulator is the whole
    # critical path to a release. `release` still requires all four results,
    # so a red quality still blocks publishing; it just no longer delays
    # finding out, and it no longer waits ~4 minutes for autofix to finish
    # doing nothing. The cost, on purpose: when quality fails this run, the
    # emulator has already run.
    # Pinned OFF ubuntu-latest on purpose: the label is migrating to Ubuntu 26
    # (runner-images#14748), and this job is the one whose seams move with the
    # image — the emulator + KVM stack, the android-emulator-runner API 30
    # image, the pinned NDK/CMake install paths, and the accessibility
    # behaviour the engine-restart recovery paths were tuned against. The
    # other jobs stay on ubuntu-latest as canaries; unpin this once one full
    # suite has passed on the 26 image.
    runs-on: ubuntu-24.04
    # A hung emulator boot or a stalled SDK download would otherwise hold a
    # runner for the 360-minute default.
    #
    # 120, NOT 90, AND THE NUMBER IS A MEASUREMENT RATHER THAN A GUESS. At 90
    # the cap CANCELLED a run that had 106 of 108 tests done with ZERO
    # failures (run 40263798436: started 03:24:32, cancelled 04:54:44). A
    # cancelled job reports nothing about the two it never reached, and the
    # release job skips on it — so a suite that is merely slow enough read
    # exactly like a suite that is broken. The suite is 108 instrumented tests
    # driving a real UI on a 320x640 emulator; 80-95 minutes of test execution
    # plus ~8 for the boot and the pre-boot APK build is the honest range, and
    # the old ceiling sat inside it.
    #
    # SMOKE ON PUSH, FULL AT NIGHT. A plain push runs the smoke subset
    # (E2E_SMOKE, 26 tests: the Google identity pair, navigation, tabs,
    # browse flow, download, profile + TOTP isolation, desktop mode, text
    # scale, IP/WebRTC policy) — the classes whose failure blocks a release
    # Google would refuse or a feature users touch daily. The complete
    # 108-test suite runs on the nightly `schedule` trigger (09:00 WIB) and
    # on a workflow_dispatch with an empty filter; the e2e_filter input keeps
    # its old meaning (a dispatch naming classes runs only those and can
    # never release). Smoke drops the push pipeline's emulator tail from
    # ~95 to ~35 minutes; the nightly guard keeps the other ~82 classes
    # honest. The known GL flake lives in DevToolsSearchE2eTest, which is
    # NOT in the smoke list — and the flake-retry net below still wraps the
    # smoke run too, since it wraps whatever the selector produced.
    #
    # This is a CEILING, not a budget: a run that finishes in 85 minutes still
    # finishes in 85. The only thing it changes is how long a genuinely hung
    # emulator is allowed to hold a runner, and 30 extra minutes is a cheaper
    # price than a release that cannot tell "slow" from "broken".
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned Android SDK components
        uses: actions/cache@v6
        with:
          # The runner image ships NDK 27.3/28.2/29.0 and CMake 3.31/4.1; this
          # build pins 27.0.12077973 and 3.22.1, so the step below takes its
          # install branch on EVERY job — five times per pipeline, on the
          # serialized path autofix -> quality -> e2e -> release. The guard
          # still runs, so a partial restore simply reinstalls.
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.0.12077973-cmake-3.22.1-${{ runner.os }}

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch the Node runtime (nodejs-mobile, pinned)
        # libnode.so is 58-65 MB per ABI and does not belong in a public
        # repository, so CI downloads the pinned release instead of it being
        # committed. The CMake configure tolerates its absence — a checkout
        # without it still builds, it just builds an APK whose runtime reports
        # itself unavailable — so this is a build input, not a release-only one.
        # The pinned release ships arm64-v8a, armeabi-v7a and x86_64 and no
        # 32-bit x86: that ABI's shim is compiled without libnode on purpose
        # (android/node/src/main/cpp/CMakeLists.txt).
        working-directory: android
        run: |
          set -euo pipefail
          TAG=v18.20.4
          ZIP="$RUNNER_TEMP/nodejs-mobile-android.zip"
          curl -sSL --retry 3 -o "$ZIP" \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${TAG}/nodejs-mobile-${TAG}-android.zip"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "node/src/main/jniLibs/$abi"
            unzip -o -j "$ZIP" "bin/$abi/libnode.so" -d "node/src/main/jniLibs/$abi" > /dev/null
          done
          mkdir -p node/src/main/cpp/nodejs-mobile
          unzip -o -q "$ZIP" 'include/*' -d node/src/main/cpp/nodejs-mobile
          test -f node/src/main/cpp/nodejs-mobile/include/node/node.h \
            || { echo "::error::the Node headers were not unpacked"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "node/src/main/jniLibs/$abi/libnode.so" \
              || { echo "::error::libnode.so is missing for $abi"; exit 1; }
          done
          echo "Node runtime unpacked: $(du -sh node/src/main/jniLibs | cut -f1)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app + test APKs before the emulator boots
        # The emulator step's script builds these too, but it does so AFTER
        # booting a software-GPU emulator on the same 4 vCPUs, so the build
        # spends its whole run competing for CPU with the thing it is about to
        # be tested on — a plausible contributor to the CPU-starvation flakes.
        # Building first means the in-script gradle call is an up-to-date
        # no-op, and a compile error costs seconds instead of a full boot.
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      - name: Run instrumented tests on emulator (API 30, x86_64)${{ inputs.e2e_filter != '' && ' — FILTERED, NOT A RELEASE GATE' || (env.E2E_MODE == 'smoke' && ' — SMOKE SUITE (release gate)' || ' — FULL SUITE') }}
        uses: reactivecircus/android-emulator-runner@v2
        # The filter and the smoke list reach the script through the
        # environment rather than through `${{ }}` interpolation into the
        # command text, so a value that is not a clean class name cannot
        # become shell source. If a variable ever fails to arrive, the
        # selector degrades to the FULL suite (the empty argument vanishes
        # before gradle sees it) — the failure direction that costs minutes
        # instead of one that costs correctness.
        env:
          E2E_FILTER: ${{ inputs.e2e_filter }}
          # SMOKE on a push/pull_request; FULL on the nightly schedule or on
          # a dispatch whose filter is empty (the old whole-suite behaviour,
          # still able to release). The parentheses matter: written bare as
          # `a || b && 'full' || 'smoke'` the expression would bind as
          # `a || (b && 'full') || 'smoke'` and render the literal "true".
          E2E_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_filter == '')) && 'full' || 'smoke' }}
          # The smoke subset: full class names, comma-separated, NO spaces —
          # the instrumentation runner splits this argument on the comma
          # only, and the selector below expands to exactly one word.
          E2E_SMOKE: com.roombrowser.A00WarmupTest,com.roombrowser.GoogleIdentityE2eTest,com.roombrowser.GoogleSignInProbeE2eTest,com.roombrowser.BrowserNavigationE2eTest,com.roombrowser.TabsE2eTest,com.roombrowser.E2EBrowseFlowTest,com.roombrowser.BlobDownloadE2eTest,com.roombrowser.ProfileIsolationTest,com.roombrowser.DesktopModeE2eTest,com.roombrowser.TextScaleE2eTest,com.roombrowser.WhatsMyIpE2eTest,com.roombrowser.TotpIsolationTest
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 4096M
          cmdline-options: -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # The runner executes EACH LINE via its own `sh -c` — multi-line
            # if/fi blocks are a syntax error (CI-proven twice). Keep the
            # failure fallback on ONE POSIX-valid line: on gradle failure,
            # dump the FULL device logcat (crash buffer + complete main
            # buffer + a UI hierarchy snapshot) into the workspace so the
            # e2e-reports artifact answers WHY from any point of the run —
            # a 2000-line tail missed the actual failure window once — then
            # exit non-zero.
            cd android && ./gradlew connectedDebugAndroidTest $([ -n "$E2E_FILTER" ] && printf '%s' "-Pandroid.testInstrumentationRunnerArguments.class=$E2E_FILTER" || { [ "$E2E_MODE" = "smoke" ] && printf '%s' "-Pandroid.testInstrumentationRunnerArguments.class=$E2E_SMOKE" || printf '%s' ""; }) --console=plain || { failed=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null | xargs -r -d '\n' awk '/<testcase / { if (match($0, /classname="[^"]*"/)) cls=substr($0, RSTART+11, RLENGTH-12) } /<failure/ && cls != "" { print cls; cls="" }' | sort -u | paste -sd, -); [ -n "$failed" ] && echo "::warning::pass 1 left failures — one retry, restricted to the classes that failed (emulator-infra flake net): $failed" && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$failed" --console=plain || { echo "::error::e2e still failing after the flake retry (classes: ${failed:-none parsed})"; false; }; } || (adb exec-out logcat -d -b crash > /home/runner/work/room-browser/e2e-logcat-crash.txt; adb exec-out logcat -d > /home/runner/work/room-browser/e2e-logcat-full.txt; adb shell uiautomator dump /sdcard/e2e-ui.xml >/dev/null 2>&1; adb pull /sdcard/e2e-ui.xml /home/runner/work/room-browser/ >/dev/null 2>&1; adb pull /sdcard/e2e-shots /home/runner/work/room-browser/ >/dev/null 2>&1; exit 1)

      # No probe step here, unlike the sibling: this edition runs ONE gradle
      # invocation, so the per-test logcat in the artifact below already
      # carries the probe lines. The step that used to sit here ran after the
      # emulator was gone and only ever produced a 0-byte file.
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            android/app/build/outputs/androidTest-results/
            /home/runner/work/room-browser/e2e-logcat-crash.txt
            /home/runner/work/room-browser/e2e-logcat-full.txt
            /home/runner/work/room-browser/e2e-ui.xml
            /home/runner/work/room-browser/e2e-shots
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # DESKTOP (Windows x64): Rust browser chrome (rbwin: tao + WebView2).
  # webview2-com binds the SDK at link time; the loader DLL is still
  # staged next to the exe as a runtime fallback for setups where the
  # static import fails to bind, keeping the zip portable either way.
  # ---------------------------------------------------------------------
  desktop-windows:
    name: Desktop build (Windows x64, Rust + WebView2)
    runs-on: windows-latest
    timeout-minutes: 40
    # Runs on every main-branch pipeline (skipped on pull_request and on the
    # nightly schedule, which exists for the e2e full suite only): desktop
    # artifacts ride the same releases the Android APKs do, so the desktop
    # tree is verified exactly as often as the app. See the release job's
    # note for why a desktop failure never blocks the APK.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The number is shared with the sibling edition (see the action): the
      # desktop artifact stamped 1.0.144 must be the same release the Android
      # APKs of this pipeline carry.
      - name: Compute version
        id: ver
        uses: ./.github/actions/release-version
        with:
          peer-repo: SecretArrow/room-browser-geckoview

      - name: Install Rust toolchain (stable, msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: rust-win-x64-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: rust-win-x64-

      - name: Unit tests (rbcore + rbchrome)
        shell: pwsh
        env:
          RB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo test --manifest-path desktop/Cargo.toml -p rbcore -p rbchrome --lib

      - name: Build (release, single exe)
        shell: pwsh
        env:
          RB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo build --manifest-path desktop/Cargo.toml --release -p rbwin --target x86_64-pc-windows-msvc

      - name: Smoke test (--version)
        shell: pwsh
        run: |
          $exe = "desktop/target/x86_64-pc-windows-msvc/release/RoomBrowser.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          & $exe --version | Tee-Object -FilePath version-out.txt
          # Select-String writes nothing and exits 0 on a non-match, so the
          # banner check has to be an explicit assertion, not a side effect.
          if (-not (Select-String -Path version-out.txt -Pattern 'Room Browser .+')) {
            throw "version banner missing from --version output"
          }

      # The static WebView2Loader lib covers the loader symbols at link time;
      # the DLL still ships beside the exe as a fallback for setups where the
      # static import fails to bind (same layout the C edition shipped).
      - name: Stage WebView2 loader DLL next to the exe
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "$env:USERPROFILE/.cargo/registry/src" -Filter WebView2Loader.dll |
            Where-Object { $_.DirectoryName -match 'x64$' } |
            Select-Object -First 1
          if ($null -eq $dll) { throw "WebView2Loader.dll not found in the cargo registry" }
          Copy-Item $dll.FullName "desktop/WebView2Loader.dll" -Force
          Get-Item "desktop/WebView2Loader.dll"

      - name: Package (portable zip)
        shell: pwsh
        run: |
          desktop\scripts\package-windows.ps1 -BuildDir desktop -Version ${{ steps.ver.outputs.version }} -DistDir desktop/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: desktop/dist/

  desktop-linux:
    name: Desktop build (Linux x64, Rust + WebKitGTK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Same gate as desktop-windows: see the note there.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK3 + WebKitGTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev

      # The same number as the Windows job and the Android release — see
      # the action for why it is read from both editions.
      - name: Compute version
        id: ver
        uses: ./.github/actions/release-version
        with:
          peer-repo: SecretArrow/room-browser-geckoview

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: rust-linux-x64-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: rust-linux-x64-

      - name: Build + run core unit tests (gcc/clang toolchain via cargo)
        env:
          RB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo test --manifest-path desktop/Cargo.toml -p rbcore -p rbchrome --lib
          cargo build --manifest-path desktop/Cargo.toml --release -p rblinux

      - name: Smoke test (--version)
        run: |
          # No `|| true` and an explicit existence check: a missing binary
          # would otherwise pass, because the pipeline's exit status is
          # tee's, and the grep's failure was being swallowed besides.
          exe=desktop/target/release/roombrowser
          test -x "$exe" || { echo "missing $exe"; exit 1; }
          "$exe" --version | tee version-out.txt
          grep -E 'Room Browser .+\(linux x86_64\)' version-out.txt

      - name: Package (deb + tar.gz)
        run: |
          desktop/scripts/package-linux.sh desktop ${{ steps.ver.outputs.version }} desktop/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: desktop/dist/

  # ---------------------------------------------------------------------
  # AUTO-RELEASE: on every green main push AND on v* tags.
  # Android: SIGNED per-ABI RELEASE APKs, ARM-focused (arm64-v8a +
  # armeabi-v7a), R8-minified. CI decodes the production keystore from the
  # ROOMBROWSER_KEYSTORE_B64 secret, builds, and refuses to publish unless
  # apksigner confirms a non-debug signature on every APK. Desktop: windows
  # zip + linux deb/tar.gz (downloaded from the desktop matrix jobs of this
  # same run). Version numbering follows the highest v1.0.x tag of EITHER
  # edition — this repo's tags and its sibling's — and REUSES the sibling's
  # number when it is already ahead, so a round of releases leaves both
  # editions on the same version instead of a number apart.
  # ---------------------------------------------------------------------
  release:
    name: Auto-release (Android + Desktop)
    # Android-first release policy: the APK/AAB ship as soon as the Android
    # gates (quality + e2e) are green. The desktop jobs stay in `needs` so
    # their artifacts attach WHEN they pass, but a desktop failure no longer
    # blocks the Android release (the desktop edition is engine-independent
    # Rust, verified by its own jobs and riding the same release train).
    # `!cancelled()` lets this run even if a desktop
    # job failed rather than skipping the whole release.
    #
    # The release is ATOMIC AT THE END: build -> sign -> verify -> upload to
    # a DRAFT release -> prove every asset landed -> publish. The draft is
    # the staging area (invisible, tag-less, never "Latest"); the publish
    # step is the single point where the tag is created and Latest moves.
    # A failure before that leaves at most a draft that a re-run resumes —
    # never a partial release marked Latest. Re-runs are idempotent per
    # COMMIT (the guard step below), so "Re-run all jobs" cannot publish
    # the same commit twice under two numbers.
    needs: [ quality, e2e, desktop-windows, desktop-linux ]
    # `!inputs.e2e_filter` is the guard that keeps a filtered run from ever
    # publishing: `needs.e2e.result == 'success'` means "the suite passed",
    # and a dispatch carrying an e2e_filter only ran the named classes. On a
    # push, a tag and a pull_request `inputs` is empty, so this term is
    # always true there and the gate is unchanged. Do not remove it because
    # "dispatch never releases" — it does, on main, and that is the whole
    # hazard: one green class would otherwise ship an APK. The nightly
    # schedule runs the FULL suite with every other gate skipped, so the
    # explicit `!= 'schedule'` term keeps the guard VERIFYING nightly
    # without ever PUBLISHING nightly.
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      !inputs.e2e_filter &&
      needs.quality.result == 'success' &&
      needs.e2e.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------------------------------------------
      # IDEMPOTENT RESUME GUARD — the first decision this job makes.
      #   * "Re-run all jobs" of a finished pipeline must NOT publish a
      #     second release for the same commit. For a main push the version
      #     action would compute the NEXT number (the first run's tag now
      #     exists), so tag names cannot be the key — COMMITS are: if any
      #     published release's tag resolves to this run's commit, the
      #     release already happened and everything below is skipped,
      #     cleanly and green.
      #   * A run that died mid-publish left at most a DRAFT release (the
      #     two steps at the bottom of this job): drafts create no tag and
      #     are never "Latest", so a re-run recomputes the SAME version,
      #     finds the draft, replaces its assets and publishes — completing
      #     the release rather than duplicating it.
      # -------------------------------------------------------------------
      - name: Skip cleanly if this commit is already released
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags -f origin
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' \
            > "$RUNNER_TEMP/published-tags.txt" 2>/dev/null || true
          released=false
          while read -r rel_tag; do
            case "${rel_tag:-}" in v*) ;; *) continue ;; esac
            commit=$(git rev-parse "${rel_tag}^{commit}" 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "::notice::release $rel_tag already exists for commit ${GITHUB_SHA:0:12} — skipping (idempotent re-run)"
              released=true
              break
            fi
          done < "$RUNNER_TEMP/published-tags.txt"
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.guard.outputs.released != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned Android SDK components
        if: steps.guard.outputs.released != 'true'
        uses: actions/cache@v6
        with:
          # The runner image ships NDK 27.3/28.2/29.0 and CMake 3.31/4.1; this
          # build pins 27.0.12077973 and 3.22.1, so the step below takes its
          # install branch on EVERY job — five times per pipeline, on the
          # serialized path autofix -> quality -> e2e -> release. The guard
          # still runs, so a partial restore simply reinstalls.
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.0.12077973-cmake-3.22.1-${{ runner.os }}

      - name: Install NDK + CMake (on-device llama.cpp engine)
        if: steps.guard.outputs.released != 'true'
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        if: steps.guard.outputs.released != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch the Node runtime (nodejs-mobile, pinned)
        if: steps.guard.outputs.released != 'true'
        # libnode.so is 58-65 MB per ABI and does not belong in a public
        # repository, so CI downloads the pinned release instead of it being
        # committed. The CMake configure tolerates its absence — a checkout
        # without it still builds, it just builds an APK whose runtime reports
        # itself unavailable — so this is a build input, not a release-only one.
        # The pinned release ships arm64-v8a, armeabi-v7a and x86_64 and no
        # 32-bit x86: that ABI's shim is compiled without libnode on purpose
        # (android/node/src/main/cpp/CMakeLists.txt).
        working-directory: android
        run: |
          set -euo pipefail
          TAG=v18.20.4
          ZIP="$RUNNER_TEMP/nodejs-mobile-android.zip"
          curl -sSL --retry 3 -o "$ZIP" \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${TAG}/nodejs-mobile-${TAG}-android.zip"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "node/src/main/jniLibs/$abi"
            unzip -o -j "$ZIP" "bin/$abi/libnode.so" -d "node/src/main/jniLibs/$abi" > /dev/null
          done
          mkdir -p node/src/main/cpp/nodejs-mobile
          unzip -o -q "$ZIP" 'include/*' -d node/src/main/cpp/nodejs-mobile
          test -f node/src/main/cpp/nodejs-mobile/include/node/node.h \
            || { echo "::error::the Node headers were not unpacked"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "node/src/main/jniLibs/$abi/libnode.so" \
              || { echo "::error::libnode.so is missing for $abi"; exit 1; }
          done
          echo "Node runtime unpacked: $(du -sh node/src/main/jniLibs | cut -f1)"

      # Whatever path cut this release, it is a STABLE release. The
      # tag-vs-main branch used to also emit `prerelease`, and main always
      # emitted `true` — so v1.0.98 through v1.0.102 were published as
      # pre-releases although nothing about them was less finished than a
      # tag-pushed build: same keystore, same gates, same APKs. Only the
      # display name still records which path cut it.
      #
      # The number itself comes from the shared action, which reads the sibling
      # edition's tags too — that is what keeps `com.roombrowser` and
      # `com.roombrowser.gecko` publishing the SAME version instead of drifting
      # a release or two apart.
      - name: Compute release tag
        if: steps.guard.outputs.released != 'true'
        id: tag
        uses: ./.github/actions/release-version
        with:
          peer-repo: SecretArrow/room-browser-geckoview

      - name: Decode the release keystore
        if: steps.guard.outputs.released != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ROOMBROWSER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROOMBROWSER_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ROOMBROWSER_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "::error::ROOMBROWSER_STORE_PASSWORD is not set"; exit 1; }
          KS="$RUNNER_TEMP/room-browser-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          # A keystore that cannot be opened is worse than no keystore at all:
          # app/build.gradle.kts only creates its `releaseFromEnv` signing
          # config when the file AND the three credentials are all present, so
          # a mistyped secret would silently fall back to the DEBUG key and
          # publish an APK that can never be upgraded over a real one. Fail
          # here instead, while the message still names the cause.
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null
          echo "ROOMBROWSER_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "Keystore decoded and verified."

      - name: Build signed release APKs + AAB (ARM-focused + universal)
        if: steps.guard.outputs.released != 'true'
        env:
          # Stamps versionName (and therefore the APK filenames) with the tag
          # this release is being published under.
          RB_VERSION_NAME: ${{ steps.tag.outputs.version }}
          # Real-device ARM ABIs only (user focus: arm64-v8a + armeabi-v7a).
          RB_RELEASE_ABIS: "arm64-v8a,armeabi-v7a"
          # Plus the universal APK on top: one file that installs on either
          # ARM device. build.gradle.kts gates isUniversalApk behind this
          # flag, so every OTHER job's focused-set check (no universal in a
          # focused build) keeps holding.
          RB_UNIVERSAL_APK: "true"
          # ROOMBROWSER_KEYSTORE comes from the decode step via GITHUB_ENV;
          # these three are the other half of the `releaseFromEnv` config.
          ROOMBROWSER_STORE_PASSWORD: ${{ secrets.ROOMBROWSER_STORE_PASSWORD }}
          ROOMBROWSER_KEY_ALIAS: ${{ secrets.ROOMBROWSER_KEY_ALIAS }}
          ROOMBROWSER_KEY_PASSWORD: ${{ secrets.ROOMBROWSER_KEY_PASSWORD }}
        # assembleRelease -> per-ABI + universal APKs; bundleRelease -> the
        # Play AAB, signed by the same releaseFromEnv keystore config.
        run: cd android && ./gradlew assembleRelease bundleRelease --console=plain

      - name: Verify the APKs carry the release signature
        if: steps.guard.outputs.released != 'true'
        # Guarded like every step below the guard: on the idempotent skip
        # path nothing was built, so this check has nothing to verify and
        # must not run — an unguarded "no release APKs were produced" here
        # would turn a clean skip red.
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no release APKs were produced"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in "${apks[@]}"; do
            # NO `|| true`: the exit code IS the verdict. The old version
            # swallowed it and only grepped for a "certificate DN:" line —
            # which catches a broken signature but not the wrong keystore.
            if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt" 2>&1; then
              cat "$RUNNER_TEMP/apk-certs.txt"
              echo "::error::apksigner verify FAILED for $(basename "$apk") — refusing to publish"
              exit 1
            fi
            cat "$RUNNER_TEMP/apk-certs.txt"
            # The label depends on the build-tools version: older ones print
            # "Signer #1 certificate DN:", current ones print
            # "V2 Signer: certificate DN:". Match the tail both share, so a
            # routine SDK bump cannot turn a correctly signed APK into a
            # failed release.
            DN=$(grep -m1 -E 'certificate DN:' "$RUNNER_TEMP/apk-certs.txt" || true)
            [ -n "$DN" ] || { echo "::error::$apk is not signed"; exit 1; }
            # The debug key here means the release signing config was never
            # created — a missing or mistyped signing secret. Never publish it.
            case "$DN" in
              *"CN=Android Debug"*) echo "::error::$apk is signed with the DEBUG key"; exit 1 ;;
            esac
            # A signature that verifies is not yet the RIGHT signature: a
            # swapped or regenerated keystore also verifies, and produces an
            # APK that cannot upgrade anything already installed under this
            # applicationId. Pin the certificate by digest.
            # Matched on the tail the label shares, like the DN above: the
            # prefix differs between build-tools ("Signer #1 certificate …" vs
            # "V2 Signer: certificate …") and only the suffix is stable.
            SHA=$(awk -F': ' '/SHA-256 digest/{print $NF; exit}' "$RUNNER_TEMP/apk-certs.txt" | tr 'A-Z' 'a-z')
            [ -n "$SHA" ] || { echo "::error::could not read the signing certificate's SHA-256 for $apk"; exit 1; }
            [ "$SHA" = "$RELEASE_CERT_SHA256" ] || {
              echo "::error::$apk is signed by the wrong key: certificate SHA-256 is $SHA, expected $RELEASE_CERT_SHA256"
              exit 1
            }
            echo "$(basename "$apk"): $DN (cert sha256 $SHA)"
          done

      - name: Verify the AAB carries the release certificate
        if: steps.guard.outputs.released != 'true'
        run: |
          set -euo pipefail
          # AGP honours VariantOutput.outputFileName for bundles only in some
          # versions, so the AAB's on-disk name is discovered, not assumed:
          # app-release.aab, or whatever single file the bundle directory
          # holds (then proven to BE a bundle below).
          aab=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          if [ -z "$aab" ]; then
            alt=$(ls android/app/build/outputs/bundle/release/ | head -1 || true)
            [ -n "$alt" ] || { echo "::error::no AAB was produced (bundle/release is empty)"; exit 1; }
            aab="android/app/build/outputs/bundle/release/$alt"
          fi
          unzip -l "$aab" | grep -q 'BundleConfig.pb' || { echo "::error::$aab is not an Android App Bundle"; exit 1; }
          # The same bar as the APKs: not merely "a signature is present",
          # but the pinned release certificate. keytool reads the JAR
          # signature of the bundle and the digest is compared pin-exact.
          # '/SHA256: ' (colon-space) matches only the fingerprint line, not
          # "Signature algorithm name: SHA256withRSA" further down.
          cert=$(keytool -printcert -jarfile "$aab" 2>/dev/null | awk -F': ' '/SHA256: /{print $NF; exit}' | tr -d ':' | tr 'A-Z' 'a-z' || true)
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            keytool -printcert -jarfile "$aab" || true
            echo "::error::AAB is signed by the wrong key: certificate SHA-256 is ${cert:-unreadable}, expected $RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "$(basename "$aab"): release certificate verified (sha256 $cert)"

      - name: Check the signed APKs' archive packaging
        if: steps.guard.outputs.released != 'true'
        # Same rules as the quality job, re-run on the artifact that actually
        # ships: this is the last point before upload, and it costs seconds.
        run: |
          set -euo pipefail
          python3 tools/verify_apk_packaging.py android/app/build/outputs/apk/release/*.apk

      - name: Download desktop artifacts (this run, if any)
        if: steps.guard.outputs.released != 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: desktop-*
          path: desktop-dist

      - name: Collect artifacts and checksums
        if: steps.guard.outputs.released != 'true'
        env:
          # The same value the build stamped into versionName, so the names
          # below can be checked against it rather than assumed.
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p release-out
          # Deterministic artifact names: gradle may emit "-release.apk" or
          # "-release-unsigned.apk" (AGP appends -unsigned only for genuinely
          # unsigned outputs) — glob BOTH and copy under the fixed signed
          # "-release" name. The step above already proved the signature, so
          # whatever matched here is signed with the release keystore.
          for abi in arm64-v8a armeabi-v7a; do
            src=$(ls android/app/build/outputs/apk/release/room-browser-*-${abi}-release*.apk 2>/dev/null | head -1 || true)
            if [ -z "$src" ]; then
              echo "::error::release APK for ${abi} missing — assembleRelease failed?"
              ls -l android/app/build/outputs/apk/release/ || true
              exit 1
            fi
            cp "$src" "release-out/room-browser-v${VERSION}-${abi}-release.apk"
          done
          # The universal APK (RB_UNIVERSAL_APK=true) is a required
          # deliverable of every release: one file that installs on either
          # ARM device.
          uni=$(ls android/app/build/outputs/apk/release/room-browser-*universal-release*.apk 2>/dev/null | head -1 || true)
          if [ -z "$uni" ]; then
            echo "::error::universal release APK missing"
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$uni" "release-out/room-browser-v${VERSION}-universal-release.apk"
          # The Play AAB. Its on-disk name is discovered rather than assumed
          # (same reasoning as the signature step above); the signature step
          # already proved the file is the real, correctly signed bundle.
          aab=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          if [ -z "$aab" ]; then
            alt=$(ls android/app/build/outputs/bundle/release/ | head -1 || true)
            [ -n "$alt" ] || { echo "::error::AAB bundle missing — bundleRelease failed?"; exit 1; }
            aab="android/app/build/outputs/bundle/release/$alt"
          fi
          unzip -l "$aab" | grep -q 'BundleConfig.pb' || { echo "::error::$aab is not an Android App Bundle"; exit 1; }
          cp "$aab" "release-out/room-browser-v${VERSION}-release.aab"
          # Desktop artifacts are OPTIONAL — attached only when the desktop
          # jobs succeeded (Android-first release policy). Never block on them.
          cp desktop-dist/desktop-windows/* release-out/ 2>/dev/null || true
          cp desktop-dist/desktop-linux/* release-out/ 2>/dev/null || true
          # The Android APK and AAB are the required deliverables of every
          # release.
          test -n "$(ls release-out/*.apk 2>/dev/null)" || { echo "APK missing — Android release build failed"; exit 1; }
          test -n "$(ls release-out/*.aab 2>/dev/null)" || { echo "AAB missing — Android release build failed"; exit 1; }
          # A release whose files are named after a DIFFERENT version is how
          # this went unnoticed for 96 releases: the tag said v1.0.96 and every
          # APK said v1.0.0, and nothing compared the two.  Fail loudly rather
          # than publish artifacts that cannot be told apart.
          named=0
          for f in release-out/room-browser-v*.apk release-out/room-browser-v*.aab; do
            [ -e "$f" ] || continue
            named=1
            case "$(basename "$f")" in
              "room-browser-v${VERSION}-"*) ;;
              *) echo "::error::$(basename "$f") does not carry version ${VERSION}"; exit 1 ;;
            esac
          done
          [ "$named" -eq 1 ] || { echo "::error::no artifact is named room-browser-v${VERSION}-*"; exit 1; }
          cd release-out && sha256sum * > checksums.sha256 && cd ..
          ls -lh release-out/

      - name: Upload artifacts
        if: steps.guard.outputs.released != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-out/

      # -------------------------------------------------------------------
      # ATOMIC PUBLISH, STAGE 1 — DRAFT. The release exists as a draft
      # (invisible, tag-less, never "Latest") while the assets land. Every
      # asset — checksums.sha256 included — is uploaded here; the next step
      # verifies them and flips the draft to published.
      #
      # TAG CREATION stays GitHub's own mechanism: the tag is created when
      # the draft is published, from the draft's target_commitish — pinned
      # explicitly to THIS run's commit so the guard above can match it
      # exactly. Resume rules for a draft left by an earlier attempt at
      # this same tag:
      #   * draft targets THIS commit    -> reuse; same-named assets are
      #     replaced, so a resumed draft is corrected, never duplicated
      #   * draft targets another commit -> deleted and recreated (an
      #     abandoned attempt whose run died before publishing must not
      #     block, or leak into, the new release)
      #   * no draft -> created fresh
      # -------------------------------------------------------------------
      - name: Create the draft release and upload every asset
        id: draft
        if: steps.guard.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-body.md" <<'BODY_EOF'
          ## Room Browser @TAG@

          **Android: SIGNED release APKs (R8-minified, release keystore) + the Play AAB — install directly, no manual signing step.**

          | Artifact | Target |
          |---|---|
          | `room-browser-v*-arm64-v8a-release.apk` | modern 64-bit ARM devices (recommended) |
          | `room-browser-v*-armeabi-v7a-release.apk` | older 32-bit ARM devices |
          | `room-browser-v*-universal-release.apk` | one file for any ARM device, both ABIs (larger) |
          | `room-browser-v*-release.aab` | Google Play upload bundle (same release keystore) |

          The desktop edition (Windows portable zip, Ubuntu deb/tar.gz) is
          built by the same pipeline — the desktop jobs run alongside the
          Android gates and finish under the emulator's run, so a green
          release carries both editions' artifacts below. When a desktop
          job fails, the release stays Android-first: the APKs still ship
          and the desktop files appear again on the next green run.

          ### Before you install

          Android reports a truncated or incomplete download as *"package
          appears to be invalid"* — the same wording as a broken build, which
          is why it is worth checking the file rather than the app. Let the
          download finish, then compare it against the published checksum
          before installing:

          ```bash
          sha256sum -c checksums.sha256 --ignore-missing
          ```

          If the device is nearly full, free space first: Android stages a
          copy while installing, so a full device rejects an APK that is
          perfectly valid.

          The APKs are signed by CI with the project's release keystore and
          verified with `apksigner` before publishing, so they upgrade in
          place over any earlier release from this repository. Confirm the
          signature yourself with:

          ```bash
          apksigner verify --print-certs room-browser-v*-arm64-v8a-release.apk
          ```

          Verify integrity with `sha256sum -c checksums.sha256`.

          ### CI gates passed
          - Android Lint (with auto-fix stage)
          - Unit tests (domain + app)
          - E2E instrumented tests on emulator (profile CRUD, cross-process browsing, storage isolation)
          - APK signature verified (v1 + v2 + v3) and pinned to the release certificate
          - AAB signature verified and pinned to the release certificate
          - Archive packaging checked against the `zipalign -c -P 16` rules

          > Note: this repository moved — releases are signed with the NEW
          > repository keystore. Updating over an APK from the previous
          > repository requires a one-time uninstall/reinstall.
          BODY_EOF
          body=$(<"$RUNNER_TEMP/release-body.md")
          printf '%s' "${body//@TAG@/$TAG}" > "$RUNNER_TEMP/release-body.md"

          # A draft left behind by an earlier attempt at this same tag is the
          # resume path (see the comment above the step).
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                 --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' \
                 | head -1 || true)
          if [ -n "$ID" ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.target_commitish // ""')
            if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
              echo "Draft release $ID for $TAG targets $target, this run built $GITHUB_SHA — deleting the abandoned draft."
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
              ID=""
            else
              echo "Resuming draft release $ID for $TAG."
            fi
          fi
          if [ -z "$ID" ]; then
            jq -n --arg tag "$TAG" --arg name "$NAME" --arg sha "$GITHUB_SHA" \
                  --rawfile body "$RUNNER_TEMP/release-body.md" \
              '{tag_name:$tag, name:$name, target_commitish:$sha, draft:true,
                prerelease:false, generate_release_notes:true, body:$body}' \
              > "$RUNNER_TEMP/draft-payload.json"
            ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                   --input "$RUNNER_TEMP/draft-payload.json" --jq '.id')
            echo "Created draft release $ID for $TAG."
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

          # Upload through `gh release upload --clobber`, NOT raw
          # `gh api --method POST repos/:/:releases/$ID/assets`: the API host
          # answers that POST with a 302 to uploads.github.com, and a
          # redirected POST arrives there as a GET — a deterministic 404, not
          # a race. That is exactly what burned v1.0.187 twice ("Created draft
          # ... / HTTP 404" one second later, then five retries all 404), while
          # every release before the rewrite (v1.0.181-186) shipped through
          # `gh release upload` without ever seeing it. --clobber replaces
          # same-named assets, so a resumed draft can be re-uploaded safely,
          # and the retry keeps its stderr visible — a swallowed error is how
          # the last fix flew blind.
          uploaded=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if err=$(gh release upload "$TAG" release-out/* --clobber 2>&1); then
              uploaded=1
              break
            fi
            echo "asset upload attempt $attempt failed: $err"
            echo "backing off — whatever landed stays, --clobber replaces it on the next try"
            sleep $((attempt * 5))
          done
          if [ -z "$uploaded" ]; then
            echo "::error::asset upload kept failing — the draft stays open, re-run this job to resume it"
            exit 1
          fi
          for f in release-out/*; do echo "uploaded: $(basename "$f")"; done

      # -------------------------------------------------------------------
      # ATOMIC PUBLISH, STAGE 2 — VERIFY, THEN PUBLISH. The flip is the
      # release's single point of going live: GitHub creates the tag here
      # (from the draft's target_commitish) and applies make_latest here.
      # Nothing is visible to users until every local file is proven present
      # on the draft at the exact uploaded size and the asset count matches.
      # -------------------------------------------------------------------
      - name: Verify every asset landed, then publish the release
        if: steps.guard.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_ID" ] || { echo "::error::no draft release id — the draft step did not run"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | [.name, (.size | tostring)] | join(" ")' \
            > "$RUNNER_TEMP/remote-assets.txt"
          bad=0
          for f in release-out/*; do
            fname=$(basename "$f")
            size=$(stat -c%s "$f")
            remote=$(awk -v n="$fname" '$1 == n {print $2}' "$RUNNER_TEMP/remote-assets.txt")
            if [ "${remote:-}" != "$size" ]; then
              echo "::error::asset $fname is missing from the draft or the wrong size (remote: ${remote:-none}, local: $size)"
              bad=1
            fi
          done
          n_remote=$(wc -l < "$RUNNER_TEMP/remote-assets.txt")
          n_local=$(ls release-out | wc -l)
          if [ "$n_remote" != "$n_local" ]; then
            echo "::error::asset count mismatch: draft has $n_remote, local has $n_local"
            bad=1
          fi
          [ "$bad" -eq 0 ] || { echo "::error::refusing to publish an incomplete release — fix the cause and re-run (the draft is resumed, not duplicated)"; exit 1; }
          # Last line of defence against the one race the guard cannot see:
          # a main push and a v* tag push run in DIFFERENT concurrency groups,
          # so two releases can compute the same number in parallel and both
          # pass the guard before either publishes. If another run published
          # this tag while this one was building, its release is the live one;
          # this draft is a duplicate and is discarded instead of published
          # over it. (Same-commit re-runs never reach here: the guard above
          # skips them first.)
          dup=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                  --jq '.[] | select(.draft == false and .tag_name == env.TAG) | .tag_name' \
                  | head -1 || true)
          if [ -n "$dup" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /dev/null
            echo "::notice::release $dup was published by a concurrent run — duplicate draft discarded, nothing published twice"
            exit 0
          fi
          jq -n '{draft:false, make_latest:"true"}' > "$RUNNER_TEMP/publish-payload.json"
          url=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                  --input "$RUNNER_TEMP/publish-payload.json" --jq '.html_url')
          echo "Published $TAG: $url"
