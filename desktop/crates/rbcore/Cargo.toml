[package]
name = "rbcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Room Browser desktop core: domain, storage, agent, wallet, local AI (pure Rust, headless)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["std"] }
data-encoding = "2"
ripemd = "0.1"
blake2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
bech32 = "0.9"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "charset"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.24", default-features = false, features = ["png"] }
quircs = "0.10.3"

[dev-dependencies]
tempfile = "3"
