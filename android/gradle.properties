# Room Browser — Gradle properties

# The daemon runs the C++/Kotlin/R8 work for a build this size (Compose, KSP,
# R8 over web3j + bouncycastle) and 1536m was too tight to let more than one
# task run at a time. Heap is reserved lazily, so the ceiling costs nothing
# when it is not reached.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# org.gradle.workers.max was pinned to 1 here. It is the lease pool that
# `parallel` and AGP's own worker consumers (aapt2, KSP, D8/R8, and ninja for
# the native build) draw from, so pinning it to 1 serialized the entire build
# and made org.gradle.parallel=true a no-op. Left unset it tracks the machine:
# 4 on a standard CI runner.
