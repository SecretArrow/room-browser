name: Quick APK

# Manual fast path: signed release APKs as WORKFLOW ARTIFACTS, no GitHub
# Release and no test gate. It exists because the auto-release (ci.yml) is
# gated on the ~50 min e2e job, which is the right bar for anything that gets
# PUBLISHED — but the wrong bar when a signed build is wanted for a phone
# right now. Nothing here publishes: it uploads the APKs to the run and
# stops, so it cannot put an unverified build in front of users.
#
# A separate file on purpose. The concurrency group in ci.yml is
# "<workflow name>-<ref>", so dispatching this one does NOT cancel a running
# CI/CD run — a job added inside ci.yml would have shared that group and
# killed the pipeline it is meant to complement.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName to stamp (blank = one past the newest v1.0.* tag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The daemon is left on: see ci.yml.
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  quick-apk:
    name: Signed release APKs (no tests, no release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pinned Android SDK components
        uses: actions/cache@v4
        with:
          # See ci.yml: the runner image ships a different NDK/CMake than this
          # build pins, so the step below would re-download ~700 MB every run.
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.0.12077973-cmake-3.22.1-${{ runner.os }}

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute the version to stamp
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags -f origin
          LATEST=$(git tag --list 'v1.0.*' | sed 's/^v1\.0\.//' | sort -n | tail -1)
          NEXT=$(( ${LATEST:-0} + 1 ))
          NAME="${{ inputs.version }}"
          [ -n "$NAME" ] || NAME="1.0.$NEXT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode: app/build.gradle.kts derives it from GITHUB_RUN_NUMBER,
          # which is PER WORKFLOW — this one's counter starts near 1, and
          # Android refuses to install a lower versionCode over an installed
          # app. Offset it into a band above the pipeline's own run numbers so
          # the APK installs straight over whatever is on the phone.
          # Consequence, on purpose and worth knowing: a later AUTO-release
          # (versionCode = the CI/CD run number) is LOWER than this, so
          # installing that one over this APK needs an uninstall first.
          echo "code=$(( 200000 + NEXT ))" >> "$GITHUB_OUTPUT"
          echo "Stamping versionName=$NAME versionCode=$(( 200000 + NEXT ))"

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ROOMBROWSER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROOMBROWSER_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ROOMBROWSER_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "::error::ROOMBROWSER_STORE_PASSWORD is not set"; exit 1; }
          KS="$RUNNER_TEMP/room-browser-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null
          echo "ROOMBROWSER_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "Keystore decoded and verified."

      - name: Report the signing configuration
        env:
          ROOMBROWSER_STORE_PASSWORD: ${{ secrets.ROOMBROWSER_STORE_PASSWORD }}
          ROOMBROWSER_KEY_ALIAS: ${{ secrets.ROOMBROWSER_KEY_ALIAS }}
          ROOMBROWSER_KEY_PASSWORD: ${{ secrets.ROOMBROWSER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Cheap, and it is how the last failure was diagnosed: the build
          # itself prints which signing config it chose, but only once gradle
          # has started, and these four are what it decides from.
          echo "RB_UNSIGNED_RELEASE=[${RB_UNSIGNED_RELEASE:-<unset>}]"
          echo "ROOMBROWSER_KEYSTORE=[${ROOMBROWSER_KEYSTORE:-<unset>}]"
          echo "store password present: $([ -n "${ROOMBROWSER_STORE_PASSWORD:-}" ] && echo yes || echo NO)"
          echo "key alias present:      $([ -n "${ROOMBROWSER_KEY_ALIAS:-}" ] && echo yes || echo NO)"
          echo "key password present:   $([ -n "${ROOMBROWSER_KEY_PASSWORD:-}" ] && echo yes || echo NO)"

      - name: Build signed release APKs (ARM-focused)
        env:
          RB_VERSION_NAME: ${{ steps.ver.outputs.name }}
          # build.gradle.kts reads the version code straight out of this
          # variable, so overriding it here is what actually stamps the
          # per-ABI codes computed above. It must be in THIS step's env (the
          # step that runs gradle) to reach the build.
          GITHUB_RUN_NUMBER: ${{ steps.ver.outputs.code }}
          RB_RELEASE_ABIS: "arm64-v8a,armeabi-v7a"
          ROOMBROWSER_STORE_PASSWORD: ${{ secrets.ROOMBROWSER_STORE_PASSWORD }}
          ROOMBROWSER_KEY_ALIAS: ${{ secrets.ROOMBROWSER_KEY_ALIAS }}
          ROOMBROWSER_KEY_PASSWORD: ${{ secrets.ROOMBROWSER_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --console=plain

      - name: Verify the APKs carry the release signature
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no release APKs were produced"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -l android/app/build/outputs/apk/release/
          for apk in "${apks[@]}"; do
            echo "--- $apk"
            unzip -l "$apk" | grep -iE 'META-INF/.*\.(RSA|DSA|EC)|META-INF/MANIFEST' || echo "(no JAR signature entries)"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > /tmp/apk-certs.txt 2>&1 || true
            cat /tmp/apk-certs.txt
            # The label depends on the build-tools version: older ones print
            # "Signer #1 certificate DN:", current ones print
            # "V2 Signer: certificate DN:". Match the tail both share, so a
            # routine SDK bump cannot turn a correctly signed APK into a
            # failed release.
            DN=$(grep -m1 -E 'certificate DN:' /tmp/apk-certs.txt || true)
            [ -n "$DN" ] || { echo "::error::$apk is not signed"; exit 1; }
            case "$DN" in
              *"CN=Android Debug"*) echo "::error::$apk is signed with the DEBUG key"; exit 1 ;;
            esac
            echo "$(basename "$apk"): $DN"
          done

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: quick-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
