name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  # ---------------------------------------------------------------------
  # AUTO-FIX: runs lintFix first; if it auto-corrects anything, the fixes
  # are committed & pushed (PAT_TOKEN re-triggers a clean pipeline run).
  # ---------------------------------------------------------------------
  autofix:
    name: Auto-fix (lintFix)
    runs-on: ubuntu-latest
    outputs:
      pushed_with_pat: ${{ steps.push.outputs.pushed_with_pat }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          # Hard verification: a corrupted/partial NDK install must FAIL the
          # job loudly (CXX1101 'missing source.properties' cost a full CI
          # round) instead of surfacing as a gradle configure error later.
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply automatic lint fixes
        working-directory: android
        run: |
          set +e
          ./gradlew lintFix --console=plain --continue
          rc=$?
          set -e
          # AGP lintFix exits 1 BY DESIGN when it applied quickfixes
          # ("Aborting build since sources were modified..."). That is the
          # success path here: fixes land via the commit step below.
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No auto-fixes were applied (lintFix exit code: $rc)."
            if [ $rc -ne 0 ]; then
              echo "lintFix failed without applying fixes — surfacing real lint errors."
              exit $rc
            fi
          else
            echo "lintFix applied changes to the working tree."
          fi

      - name: Commit and push fixes (if any)
        id: push
        run: |
          git config user.name  "room-browser-autofix"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to auto-fix."
            echo "pushed_with_pat=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "chore(ci): auto-fix lint findings [skip ci]"
          # Prefer PAT_TOKEN: pushes with it re-trigger the workflow so the
          # fixed tree gets a full clean pipeline run (GITHUB_TOKEN would not).
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            git push "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
            echo "pushed_with_pat=true" >> "$GITHUB_OUTPUT"
            echo "Auto-fixes pushed with PAT — a fresh CI run now validates the fixed tree."
          else
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
            echo "pushed_with_pat=false" >> "$GITHUB_OUTPUT"
            echo "WARN: PAT_TOKEN secret not set — pushed with GITHUB_TOKEN (no re-trigger)."
          fi

  # ---------------------------------------------------------------------
  # QUALITY GATE: lint + unit tests + debug build on JVM only.
  # Skipped when auto-fix already pushed (fresh run is on its way).
  # ---------------------------------------------------------------------
  quality:
    name: Lint + unit tests + debug build
    needs: autofix
    if: needs.autofix.outputs.pushed_with_pat != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (Android Lint)
        working-directory: android
        run: ./gradlew lintDebug --console=plain

      - name: Unit tests (domain + app)
        working-directory: android
        run: ./gradlew testDebugUnitTest :core:domain:test --console=plain

      - name: Debug build (all ABIs)
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/
            android/core/domain/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # E2E / INSTRUMENTED TESTS on a real emulator:
  # profile CRUD, cross-process browsing flow, DB isolation, WebView
  # data-directory binding (spec sections 59/60).
  # ---------------------------------------------------------------------
  e2e:
    name: E2E instrumented tests (emulator)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 4096M
          cmdline-options: -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # The runner executes EACH LINE via its own `sh -c` — multi-line
            # if/fi blocks are a syntax error (CI-proven twice). Keep the
            # failure fallback on ONE POSIX-valid line: on gradle failure,
            # dump the device logcat (crash buffer + tail) into the workspace
            # so the e2e-reports artifact answers WHY, then exit non-zero.
            cd android && ./gradlew connectedDebugAndroidTest --console=plain || (adb exec-out logcat -d -b crash > /home/runner/work/room-browser/e2e-logcat-crash.txt; adb exec-out logcat -d -t 2000 > /home/runner/work/room-browser/e2e-logcat-tail.txt; exit 1)

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            android/app/build/outputs/androidTest-results/
            /home/runner/work/room-browser/e2e-logcat-crash.txt
            /home/runner/work/room-browser/e2e-logcat-tail.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # DESKTOP (Windows x64): pure-C browser chrome (Win32) + WebView2.
  # Headers come from the official WebView2 NuGet SDK; the loader DLL is
  # loaded at runtime via LoadLibrary (no .lib linkage, no CRT mismatch)
  # and shipped next to the exe for a portable zip.
  # ---------------------------------------------------------------------
  desktop-windows:
    name: Desktop build (Windows x64, C + WebView2)
    needs: autofix
    if: needs.autofix.outputs.pushed_with_pat != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags -f origin
            LATEST=$(git tag --list 'v1.0.*' | sed 's/^v1\.0\.//' | sort -n | tail -1)
            NEXT=$(( ${LATEST:-0} + 1 ))
            V="1.0.$NEXT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "computed version: $V"

      - name: Fetch WebView2 SDK (official NuGet package)
        shell: pwsh
        run: |
          $sdk = "1.0.2903.40"
          curl.exe -sSL -o webview2.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$sdk"
          Copy-Item webview2.nupkg webview2.zip -Force
          Expand-Archive webview2.zip -DestinationPath webview2-sdk -Force
          $inc = (Get-ChildItem -Path webview2-sdk -Recurse -Filter WebView2.h | Select-Object -First 1).DirectoryName
          $dll = (Get-ChildItem -Path webview2-sdk -Recurse -Filter WebView2Loader.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $dll) { $dll = (Get-ChildItem -Path webview2-sdk -Recurse -Filter WebView2Loader.dll | Select-Object -First 1).FullName }
          if (-not $inc -or -not $dll) {
            Write-Host "WebView2 SDK layout not recognized — dumping tree:"
            Get-ChildItem -Recurse webview2-sdk | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "WEBVIEW2_INCLUDE=$inc"
          Add-Content -Path $env:GITHUB_ENV -Value "WEBVIEW2_DLL=$dll"
          Write-Host "headers: $inc"
          Write-Host "loader : $dll"

      - name: Configure + build (MSVC, C11)
        shell: pwsh
        run: |
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release `
                -DROOMBROWSER_VERSION="${{ steps.ver.outputs.version }}" `
                -DWEBVIEW2_INCLUDE_DIR="$env:WEBVIEW2_INCLUDE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build desktop/build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (--version, retried)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Join-Path $PWD "desktop\build\Release\RoomBrowser.exe"
          if (-not (Test-Path $exe)) { Write-Host "RoomBrowser.exe missing"; exit 1 }
          $out = Join-Path $PWD "version-out.txt"
          $ok = $false
          # A freshly-linked unsigned exe can hit transient AV/Defender handle
          # races on the runner (CI-proven: identical commit green one run,
          # empty --out file the next). Retry at the process level and key
          # off BOTH the exit code and the file content.
          foreach ($attempt in 1..3) {
            Remove-Item -Path $out -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--version","--out","$out" -PassThru -Wait
            $line = Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "attempt $attempt exit code: $($p.ExitCode)"
            Write-Host "attempt $attempt version output: $line"
            if (($p.ExitCode -eq 0) -and ($line -match "Room Browser .+\(windows x86_64\)")) { $ok = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { Write-Host "smoke test failed after 3 attempts"; exit 1 }

      - name: Stage WebView2 loader DLL next to the exe
        shell: pwsh
        run: |
          Copy-Item "$env:WEBVIEW2_DLL" "desktop\build\Release\" -Force
          Get-ChildItem "desktop\build\Release"

      - name: Package (portable zip)
        shell: pwsh
        run: |
          desktop\scripts\package-windows.ps1 -BuildDir desktop\build\Release -Version ${{ steps.ver.outputs.version }} -DistDir desktop\dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/

  # ---------------------------------------------------------------------
  # DESKTOP (Ubuntu x64): pure-C browser chrome (GTK3) + WebKitGTK.
  # Runs the shared C-core unit tests, then packages deb + tar.gz.
  # ---------------------------------------------------------------------
  desktop-linux:
    name: Desktop build (Ubuntu x64, C + WebKitGTK)
    needs: autofix
    if: needs.autofix.outputs.pushed_with_pat != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK3 + WebKitGTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags -f origin
            LATEST=$(git tag --list 'v1.0.*' | sed 's/^v1\.0\.//' | sort -n | tail -1)
            NEXT=$(( ${LATEST:-0} + 1 ))
            V="1.0.$NEXT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "computed version: $V"

      - name: Configure + build (gcc, C11) + run core unit tests
        run: |
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release \
                -DROOMBROWSER_VERSION="${{ steps.ver.outputs.version }}" \
                -DRB_BUILD_TESTS=ON
          cmake --build desktop/build -j"$(nproc)"
          ./desktop/build/rb_tests

      - name: Smoke test (--version)
        run: |
          ./desktop/build/roombrowser --version | tee version-out.txt
          grep -E 'Room Browser .+\(linux x86_64\)' version-out.txt

      - name: Package (deb + tar.gz)
        run: |
          desktop/scripts/package-linux.sh desktop/build ${{ steps.ver.outputs.version }} desktop/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/dist/

  # ---------------------------------------------------------------------
  # AUTO-RELEASE: on every green main push AND on v* tags.
  # Android: signed per-ABI APKs + universal + AAB.
  # Desktop: windows zip + linux deb/tar.gz (downloaded from the desktop
  # matrix jobs of this same run). Version numbering continues from the
  # highest existing v1.0.x tag (the repo moved, run numbers restarted).
  # ---------------------------------------------------------------------
  release:
    name: Auto-release (Android + Desktop)
    needs: [ quality, e2e, desktop-windows, desktop-linux ]
    if: >-
      !cancelled() &&
      needs.quality.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.desktop-windows.result == 'success' &&
      needs.desktop-linux.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + CMake (on-device llama.cpp engine)
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE_DIR=$(ls -d /usr/local/lib/android/sdk/cmake/3.22.1 2>/dev/null || true)
          if [ ! -f "$NDK/source.properties" ] || [ -z "$CMAKE_DIR" ]; then
            echo "NDK/CMake missing or incomplete — (re)installing…"
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          fi
          test -f "$NDK/source.properties" || { echo "NDK source.properties missing after install"; exit 1; }
          test -d "$CMAKE_DIR" || test -d /usr/local/lib/android/sdk/cmake/3.22.1 || { echo "cmake 3.22.1 missing after install"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}"                  >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                        >> "$GITHUB_OUTPUT"
            echo "name=Room Browser ${GITHUB_REF_NAME}"    >> "$GITHUB_OUTPUT"
          else
            git fetch --tags -f origin
            LATEST=$(git tag --list 'v1.0.*' | sed 's/^v1\.0\.//' | sort -n | tail -1)
            NEXT=$(( ${LATEST:-0} + 1 ))
            echo "tag=v1.0.$NEXT"                          >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                         >> "$GITHUB_OUTPUT"
            echo "name=Room Browser v1.0.$NEXT (main)"     >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore (from repository secrets)
        run: |
          if [ -n "${{ secrets.ROOMBROWSER_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ROOMBROWSER_KEYSTORE_B64 }}" | base64 -d > $HOME/room-browser-release.jks
            echo "ROOMBROWSER_KEYSTORE=$HOME/room-browser-release.jks"      >> $GITHUB_ENV
            echo "ROOMBROWSER_STORE_PASSWORD=${{ secrets.ROOMBROWSER_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ROOMBROWSER_KEY_ALIAS=${{ secrets.ROOMBROWSER_KEY_ALIAS }}"           >> $GITHUB_ENV
            echo "ROOMBROWSER_KEY_PASSWORD=${{ secrets.ROOMBROWSER_KEY_PASSWORD }}"     >> $GITHUB_ENV
            echo "SIGNING_MODE=release-keyed" >> $GITHUB_ENV
          else
            echo "SIGNING_MODE=debug-fallback" >> $GITHUB_ENV
            echo "No signing secrets found — building with debug-signing fallback. See RELEASE.md." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build signed release APKs (ABI splits + universal)
        run: cd android && ./gradlew assembleRelease --console=plain

      - name: Build Android App Bundle
        run: cd android && ./gradlew bundleRelease --console=plain

      - name: Download desktop artifacts (this run)
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-dist

      - name: Collect artifacts and checksums
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/*.apk release-out/
          cp android/app/build/outputs/bundle/release/*.aab release-out/ || true
          cp desktop-dist/desktop-windows/* release-out/
          cp desktop-dist/desktop-linux/* release-out/
          test -n "$(ls release-out/*.zip release-out/*.deb 2>/dev/null)" || { echo "desktop artifacts missing"; exit 1; }
          cd release-out && sha256sum * > checksums.sha256 && cd ..
          ls -lh release-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: release-out/*
          body: |
            ## Room Browser ${{ steps.tag.outputs.tag }}

            **Android: signed per-ABI APKs + universal + AAB. Desktop: Windows portable zip + Ubuntu deb/tar.gz (pure-C browser).**

            | Artifact | Target |
            |---|---|
            | `arm64-v8a` | modern 64-bit ARM devices (recommended) |
            | `armeabi-v7a` | older 32-bit ARM devices |
            | `x86_64` / `x86` | emulators, x86 devices |
            | `universal` | all ABIs (larger download) |
            | `.aab` | Play Store upload |
            | `*-windows-x64.zip` | Windows 10/11 — portable zip (exe + WebView2Loader.dll) |
            | `*_amd64.deb` | Ubuntu/Debian — `apt` package (pulls GTK3 + WebKitGTK deps) |
            | `*-linux-x64.tar.gz` | any modern Linux with GTK3 + WebKitGTK |

            Verify integrity with `sha256sum -c checksums.sha256`.

            ### CI gates passed
            - Android Lint (with auto-fix stage)
            - Unit tests (domain + app + desktop C core)
            - E2E instrumented tests on emulator (profile CRUD, cross-process browsing, storage isolation)
            - Desktop `--version` smoke tests (Windows MSVC + Ubuntu gcc builds)

            > Note: this repository moved — releases are signed with the NEW
            > repository keystore. Updating over an APK from the previous
            > repository requires a one-time uninstall/reinstall.

            ${{ env.SIGNING_MODE == 'debug-fallback' && '⚠️ Built with fallback debug signing — configure repository secrets (see android/RELEASE.md) for production signing.' || '✅ Signed with the release keystore.' }}
